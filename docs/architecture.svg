<svg xmlns="http://www.w3.org/2000/svg" width="680" height="670" viewBox="0 0 680 670" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>CV RAG assistant: end-to-end architecture</title>
<style>
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#04342C}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#26215C}.purple .ts{fill:#534AB7}
.arr{stroke:#73726C;stroke-width:1.5;fill:none}.retry{stroke:#D85A30;stroke-width:1.5;fill:none}
.label{font-size:12px;fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="670" fill="#FFFFFF"/>
<rect x="20" y="16" width="640" height="104" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="label" x="36" y="36">Streamlit UI (app/streamlit_app.py)</text>
<g class="gray"><rect x="40" y="50" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="74" text-anchor="middle">Upload CVs</text><text class="ts" x="170" y="92" text-anchor="middle">sidebar or scripts/ingest.py</text></g>
<g class="gray"><rect x="380" y="50" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="74" text-anchor="middle">Ask a question</text><text class="ts" x="510" y="92" text-anchor="middle">chat with history</text></g>
<line x1="170" y1="108" x2="170" y2="148" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="108" x2="510" y2="148" class="arr" marker-end="url(#arrow)"/>
<g class="teal"><rect x="40" y="150" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="174" text-anchor="middle">Parse text</text><text class="ts" x="170" y="192" text-anchor="middle">PDF, DOCX, TXT, MD</text></g>
<g class="teal"><rect x="40" y="230" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="254" text-anchor="middle">Split into chunks</text><text class="ts" x="170" y="272" text-anchor="middle">by CV section, about 800 chars</text></g>
<g class="teal"><rect x="40" y="310" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="334" text-anchor="middle">Embed chunks</text><text class="ts" x="170" y="352" text-anchor="middle">OpenAI text-embedding-3-large</text></g>
<g class="teal"><rect x="40" y="390" width="260" height="56" rx="8" stroke-width="1"/><text class="th" x="170" y="414" text-anchor="middle">Chroma vector store</text><text class="ts" x="170" y="432" text-anchor="middle">local ./chroma_db, cosine</text></g>
<line x1="170" y1="206" x2="170" y2="228" class="arr" marker-end="url(#arrow)"/>
<line x1="170" y1="286" x2="170" y2="308" class="arr" marker-end="url(#arrow)"/>
<line x1="170" y1="366" x2="170" y2="388" class="arr" marker-end="url(#arrow)"/>
<g class="gray"><rect x="40" y="470" width="260" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="170" y="494" text-anchor="middle">Evaluation (offline)</text><text class="ts" x="170" y="512" text-anchor="middle">runs read path, GPT-4o judge</text></g>
<g class="purple"><rect x="380" y="150" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="174" text-anchor="middle">Analyze</text><text class="ts" x="510" y="192" text-anchor="middle">standalone query, candidate names</text></g>
<g class="purple"><rect x="380" y="230" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="254" text-anchor="middle">Retrieve</text><text class="ts" x="510" y="272" text-anchor="middle">MMR top 6, candidate filter</text></g>
<g class="purple"><rect x="380" y="310" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="334" text-anchor="middle">Grade</text><text class="ts" x="510" y="352" text-anchor="middle">LLM keeps relevant chunks</text></g>
<g class="purple"><rect x="380" y="390" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="414" text-anchor="middle">Generate</text><text class="ts" x="510" y="432" text-anchor="middle">GPT-4o-mini, cited answer</text></g>
<g class="purple"><rect x="380" y="470" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="494" text-anchor="middle">Verify</text><text class="ts" x="510" y="512" text-anchor="middle">is the answer grounded in the CVs?</text></g>
<g class="gray"><rect x="380" y="550" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="510" y="574" text-anchor="middle">Answer in chat</text><text class="ts" x="510" y="592" text-anchor="middle">with cited CV sources</text></g>
<line x1="510" y1="206" x2="510" y2="228" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="286" x2="510" y2="308" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="366" x2="510" y2="388" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="446" x2="510" y2="468" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="526" x2="510" y2="548" class="arr" marker-end="url(#arrow)"/>
<path d="M302 418 H340 V258 H378" class="arr" marker-end="url(#arrow)"/>
<path d="M640 338 H658 V258 H642" class="retry" marker-end="url(#arrow-retry)"/>
<path d="M640 498 H658 V418 H642" class="retry" marker-end="url(#arrow-retry)"/>
<g class="teal"><rect x="40" y="634" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="label" x="62" y="645">Write path (indexing)</text>
<g class="purple"><rect x="210" y="634" width="14" height="14" rx="3" stroke-width="0.5"/></g>
<text class="label" x="232" y="645">Read path (LangGraph)</text>
<line x1="390" y1="641" x2="414" y2="641" class="retry"/>
<text class="label" x="422" y="645">Retry: rewrite query, regenerate</text>
</svg>
