[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-rag-assistant"
version = "0.1.0"
description = "Question answering over CVs with OpenAI, LangGraph, Chroma and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-chroma>=0.2",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "streamlit>=1.40",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
